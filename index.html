<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>MAT2 SPS 3D Simulator</title>
  </head>
  <body>
    <!-- App shell mount point (ARCHITECTURE.md §3): ui/App.ts renders the whole layout
         (3D viewport, AWL editor, messages, watch table, control bar) into #app and creates
         the #scene-canvas the SceneManager draws into. No visible text lives in this file —
         every string is inserted at runtime through the i18n layer (§5.6), so the EN/DE
         toggle has nothing it cannot reach. The lang attribute above is the pre-boot
         default; main.ts sets it from the persisted locale. -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
